[workspace]
resolver = "3"
members = ["dwsh", "logout"]

[workspace.lints.clippy]
pedantic = "warn"

[workspace.package]
version = "0.0.1"
authors = ["ckgxrg <ckgxrg@ckgxrg.io>"]
edition = "2024"
license = "BSD 2 Clause"
description = "A desktop shell for my laptop"
repository = "https://codeberg.org/ckgxrg/dwsh"

[workspace.dependencies]
iced = { version = "0.14.0", features = ["tokio", "image", "svg"] }
iced_exwlshell = "0.19.1"
wayland-client = "0.31.15"

wayle-core = "0.1.2"
wayle-media = "0.1.3"
wayle-battery = "0.1.2"
wayle-sysinfo = "0.1.2"
wayle-systray = "0.1.4"
wayle-niri = "0.1.2"
chrono = "0.4.42"
niri-ipc = "26.4.0"

tokio = { version = "1.52.3", features = ["full"] }
futures = "0.3.33"
anyhow = "1.0.102"
freedesktop-icons = "0.4.0"
linicon-theme = "1.2.0"
