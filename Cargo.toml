[workspace]
resolver = "3"
members = ["dwsh", "logout"]

[workspace.lints.clippy]
pedantic = "warn"

[workspace.package]
version = "0.0.1"
authors = ["ckgxrg <ckgxrg@ckgxrg.io>"]
edition = "2024"
license = "BSD 2 Clause"
description = "A desktop shell for my laptop"
repository = "https://codeberg.org/ckgxrg/dwsh"

[workspace.dependencies]
relm4 = "0.11.0"
gtk4-layer-shell = "0.8.0"
gtk4 = "0.11.2"

wayle-core = "0.1.2"
wayle-media = "0.1.3"
wayle-battery = "0.1.2"
wayle-sysinfo = "0.1.2"
wayle-systray = { version = "0.1.4", features = ["adapter-gtk"] }
wayle-niri = "0.1.2"
chrono = "0.4.42"
niri-ipc = "26.4.0"

tokio = { version = "1.52.3", features = ["full"] }
futures = "0.3.33"
anyhow = "1.0.102"
